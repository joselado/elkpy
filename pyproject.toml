[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elkpy"
version = "0.1.0.dev0"
description = "Python interface to the Elk FP-LAPW DFT code"
requires-python = ">=3.9"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
ase = ["ase"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
